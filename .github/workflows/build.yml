name: Gerar MacroGravador.exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Gerar o .exe
        run: pyinstaller --onefile --noconsole --name MacroGravador macro_gravador.py

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MacroGravador (último build)
          files: dist/MacroGravador.exe
